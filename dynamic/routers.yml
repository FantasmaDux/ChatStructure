http:
  routers:
    auth-service:
      rule: "PathPrefix(`/auth`)"
      service: auth-service
      entryPoints:
        - web
#      middlewares:
#        - strip-auth-prefix

    networking-service:
      rule: "PathPrefix(`/networking`)"
      service: networking-service
      entryPoints:
        - web
#      middlewares:
#        - strip-networking-prefix

    messenger-service:
      rule: "PathPrefix(`/messenger`)"
      service: messenger-service
      entryPoints:
        - web
#      middlewares:
#        - strip-networking-prefix

    kafka-ui-router:  # должно быть уникальным
      rule: "PathPrefix(`/kafka-ui`)"
      service: kafka-ui-service  # должно совпадать с именем сервиса
      entryPoints:
        - web
