services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_INIT_LIMIT: 3
      ZOOKEEPER_SYNC_LIMIT: 2
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/2181'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    networks:
      - shared-network
      - kafka-network
  
  kafka1:
    image: confluentinc/cp-server:7.7.1
    hostname: kafka1
    container_name: kafka1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092, PLAINTEXT_HOST://localhost:9092
    networks:
      - shared-network
      - kafka-network

  kafka2:
    image: confluentinc/cp-server:7.7.1
    hostname: kafka2
    container_name: kafka2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29093, PLAINTEXT_HOST://localhost:9093
    networks:
      - shared-network
      - kafka-network

  kafka3:
    image: confluentinc/cp-server:7.7.1
    hostname: kafka3
    container_name: kafka3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29094, PLAINTEXT_HOST://localhost:9094
    networks:
      - shared-network
      - kafka-network
  
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9020:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092, kafka2:29093, kafka3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - shared-network
      - kafka-network

  
  auth-micro:
    container_name: auth-micro
    build:
      context: ./component/AuthMicro
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "${GRPC_PORT}:${GRPC_PORT}"
    env_file:
      - ./.env
    environment:
      PGHOST: auth-db-postgres
      PGUSER: ${AUTH_POSTGRES_DB_USER}
      PGPASSWORD: ${AUTH_POSTGRES_DB_PASSWORD}
      PGDATABASE: ${AUTH_POSTGRES_DB_NAME}
      PGPORT: ${AUTH_POSTGRES_DB_INTERNAL_PORT}
      PGSSLMODE: ${AUTH_PGSSLMODE_STATUS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}  # minutes
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}  # 7 days in minutes
      HTTP_SERVER_ADDRESS: 0.0.0.0:${HTTP_PORT}
      GRPC_SERVER_ADDRESS: 0.0.0.0:${GRPC_PORT}
      LOG_LEVEL: debug
    depends_on:
      auth-db-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth-network
      - shared-network

  auth-db-postgres:
    container_name: auth-db-postgres
    image: postgres:16-alpine
    ports:
      - "${AUTH_POSTGRES_DB_EXTERNAL_PORT}:${AUTH_POSTGRES_DB_INTERNAL_PORT}"
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB_NAME}
      POSTGRES_USER: ${AUTH_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $AUTH_POSTGRES_DB_USER -d $AUTH_POSTGRES_DB_NAME'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    volumes:
      - auth-db-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - auth-network


  messenger-micro:
    container_name: messenger-micro
    build:
      context: ./component/MessengerMicro
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./.env
    environment:
      PGHOST: messenger-db-postgres
      PGPORT: ${MESSENGER_POSTGRES_DB_INTERNAL_PORT}
      PGUSER: ${MESSENGER_POSTGRES_DB_USER}
      PGPASSWORD: ${MESSENGER_POSTGRES_DB_PASSWORD}
      PGDATABASE: ${MESSENGER_POSTGRES_DB_NAME}
      PGSSLMODE: ${MESSENGER_PGSSLMODE_STATUS}
    depends_on:
      messenger-db-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - messenger-network
      - shared-network

  messenger-db-postgres:
    container_name: messenger-db-postgres
    image: postgres:16-alpine
    ports:
      - "${MESSENGER_POSTGRES_DB_EXTERNAL_PORT}:${MESSENGER_POSTGRES_DB_INTERNAL_PORT}"
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${MESSENGER_POSTGRES_DB_NAME}
      POSTGRES_USER: ${MESSENGER_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${MESSENGER_POSTGRES_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $MESSENGER_POSTGRES_DB_USER -d $MESSENGER_POSTGRES_DB_NAME'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    volumes:
      - messenger-db-postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - messenger-network


  networking-micro:
    container_name: networking-micro
    build:
      context: ./component/NetworkingMicro
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - ./.env
    environment:
      DB_HOST: networking-db-postgres
      DB_NAME: ${NETWORKING_POSTGRES_DB_NAME}
      DB_PORT: ${NETWORKING_POSTGRES_DB_INTERNAL_PORT}
      DB_USER: ${NETWORKING_POSTGRES_DB_USER}
      DB_PASS: ${NETWORKING_POSTGRES_DB_PASSWORD}
      DB_SSLMODE: ${NETWORKING_PGSSLMODE_STATUS}
      DB_AUTO_MIGRATE: true
      LOG_OUTPUT: file
      LOG_DIR: logs
    depends_on:
      networking-db-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - networking-network
      - shared-network
  
  networking-db-postgres:
    container_name: networking-db-postgres
    image: postgres:16-alpine
    ports:
      - "${NETWORKING_POSTGRES_DB_EXTERNAL_PORT}:${NETWORKING_POSTGRES_DB_INTERNAL_PORT}"
    environment:
      PGPORT: ${NETWORKING_POSTGRES_DB_INTERNAL_PORT}
      POSTGRES_DB: ${NETWORKING_POSTGRES_DB_NAME}
      POSTGRES_USER: ${NETWORKING_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${NETWORKING_POSTGRES_DB_PASSWORD}
    volumes:
      - networking-db-postgres:/var/lib/postgresql/data
      - ./component/NetworkingMicro/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $NETWORKING_POSTGRES_DB_USER -d $NETWORKING_POSTGRES_DB_NAME'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    networks:
      - networking-network


volumes:
  auth-db-postgres:
  messenger-db-postgres:
  networking-db-postgres:


networks:
  shared-network:
    driver: bridge
  kafka-network:
    driver: bridge

  auth-network:
    driver: bridge
  messenger-network:
    driver: bridge
  networking-network:
    driver: bridge
