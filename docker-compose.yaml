services:
  traefik:
    container_name: traefik
    image: traefik:v3.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - shared-network
    env_file:
      - ./.env
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefic.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/dynamic:ro
    labels:
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${BASIC_AUTH_USER_PASS}"


  auth-service:
    build:
      context: ./component/AuthMicro
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      POSTGRES_DB_HOST: ${AUTH_POSTGRES_DB_HOST}
      POSTGRES_DB: ${AUTH_POSTGRES_DB_NAME}
      POSTGRES_USER: ${AUTH_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_DB_PASSWORD}
      POSTGRES_DB_INTERNAL_PORT: ${AUTH_POSTGRES_DB_INTERNAL_PORT}
      PGSSLMODE_STATUS: ${AUTH_PGSSLMODE_STATUS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      LOG_LEVEL: debug
    depends_on:
      auth-db-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth-network
      - shared-network

  auth-db-postgres:
    image: postgres:16-alpine
    ports:
      - "${AUTH_POSTGRES_DB_EXTERNAL_PORT}:${AUTH_POSTGRES_DB_INTERNAL_PORT}"
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB_NAME}
      POSTGRES_USER: ${AUTH_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $AUTH_POSTGRES_DB_USER -d $AUTH_POSTGRES_DB_NAME'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    volumes:
      - auth-db-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - auth-network


  networking-service:
    build:
      context: ./component/NetworkingMicro
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      POSTGRES_DB_HOST: ${NETWORKING_POSTGRES_DB_HOST}
      POSTGRES_DB: ${NETWORKING_POSTGRES_DB_NAME}
      POSTGRES_DB_INTERNAL_PORT: ${NETWORKING_POSTGRES_DB_INTERNAL_PORT}
      POSTGRES_USER: ${NETWORKING_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${NETWORKING_POSTGRES_DB_PASSWORD}
      PGSSLMODE_STATUS: ${NETWORKING_PGSSLMODE_STATUS}
      DB_AUTO_MIGRATE: true
      LOG_OUTPUT: file
      LOG_DIR: logs
    depends_on:
      networking-db-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - networking-network
      - shared-network

  networking-db-postgres:
    image: postgres:16-alpine
    ports:
      - "${NETWORKING_POSTGRES_DB_EXTERNAL_PORT}:${NETWORKING_POSTGRES_DB_INTERNAL_PORT}"
    environment:
      PGPORT: ${NETWORKING_POSTGRES_DB_INTERNAL_PORT}
      POSTGRES_DB: ${NETWORKING_POSTGRES_DB_NAME}
      POSTGRES_USER: ${NETWORKING_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${NETWORKING_POSTGRES_DB_PASSWORD}
    volumes:
      - networking-db-postgres:/var/lib/postgresql/data
      - ./component/NetworkingMicro/src/main/resources/data/tables_postgres.sql:/docker-entrypoint-initdb.d/tables_postgres.sql
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $NETWORKING_POSTGRES_DB_USER -d $NETWORKING_POSTGRES_DB_NAME'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    networks:
      - networking-network



  messenger-service:
    build:
      context: ./component/MessengerMicro
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      POSTGRES_DB_HOST: ${MESSENGER_POSTGRES_DB_HOST}
      POSTGRES_DB: ${MESSENGER_POSTGRES_DB_NAME}
      POSTGRES_DB_INTERNAL_PORT: ${MESSENGER_POSTGRES_DB_INTERNAL_PORT}
      POSTGRES_USER: ${MESSENGER_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${MESSENGER_POSTGRES_DB_PASSWORD}
      PGSSLMODE_STATUS: ${MESSENGER_PGSSLMODE_STATUS}
      DB_AUTO_MIGRATE: true
      LOG_OUTPUT: file
      LOG_DIR: logs
    depends_on:
      messenger-db-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - messenger-network
      - shared-network

  messenger-db-postgres:
    image: postgres:16-alpine
    ports:
      - "${MESSENGER_POSTGRES_DB_EXTERNAL_PORT}:${MESSENGER_POSTGRES_DB_INTERNAL_PORT}"
    environment:
      PGPORT: ${MESSENGER_POSTGRES_DB_INTERNAL_PORT}
      POSTGRES_DB: ${MESSENGER_POSTGRES_DB_NAME}
      POSTGRES_USER: ${MESSENGER_POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${MESSENGER_POSTGRES_DB_PASSWORD}
    volumes:
      - messenger-db-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $MESSENGER_POSTGRES_DB_USER -d $MESSENGER_POSTGRES_DB_NAME'" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    networks:
      - messenger-network



  kafka:
    container_name: kafka
    image: apache/kafka:4.1.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_BROKER_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/tmp/logs
      - KAFKA_LISTENERS=PLAINTEXT://:9096,CONTROLLER://:9093,INTERNAL://:9098
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9096,INTERNAL://kafka:9098
    ports:
      - "0.0.0.0:9096:9096"
    networks:
      - shared-network

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui
    restart: "always"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9098
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    depends_on:
      - kafka
    networks:
      - shared-network



volumes:
  auth-db-postgres:
  networking-db-postgres:
  messenger-db-postgres:


networks:
  shared-network:
    name: shared-network
    driver: bridge

  auth-network:
    name: auth-network
    driver: bridge

  networking-network:
    name: networking-network
    driver: bridge

  messenger-network:
    name: messenger-network
    driver: bridge
